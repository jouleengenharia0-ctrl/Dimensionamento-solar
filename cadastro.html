<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Inversores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.6em; }
        .header a { color: white; text-decoration: none; font-size: 0.9em; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #2c3e50; }
        select, input, button {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        button:hover { background: #2980b9; }
        button.secundario { background: #7f8c8d; margin-top: 8px; }
        button.secundario:hover { background: #636e72; }
        button.remover { background: #e74c3c; width: auto; padding: 6px 12px; font-size: 0.85em; }
        button.remover:hover { background: #c0392b; }
        .config-group { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .msg { padding: 12px 15px; border-radius: 8px; margin-bottom: 18px; font-weight: 600; display: none; }
        .msg.erro { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .msg.sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e9ecef; font-size: 0.9em; }
        th { color: #495057; }
        #telaLogin { max-width: 380px; margin: 40px auto; }
        #telaCadastro { display: none; }
        hr { margin: 30px 0; border: none; border-top: 1px solid #e9ecef; }
        .lista-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .busca-lista { max-width: 260px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Cadastro de Inversores</h1>
            <a href="index.html">&larr; Voltar ao dimensionamento</a>
        </div>
        <div class="content">
            <div id="msgGlobal" class="msg"></div>

            <div id="telaLogin">
                <h3 style="margin-bottom:15px;">Login</h3>
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="loginSenha">Senha</label>
                    <input type="password" id="loginSenha" placeholder="••••••••">
                </div>
                <button id="btnLogin">Entrar</button>
            </div>

            <div id="telaCadastro">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <span id="usuarioLogado" style="color:#495057;font-size:0.9em;"></span>
                    <button id="btnLogout" class="secundario" style="width:auto;padding:8px 14px;">Sair</button>
                </div>

                <h3 style="margin-bottom:15px;">Novo inversor</h3>
                <div class="form-group">
                    <label for="campoNome">Marca - Modelo</label>
                    <input type="text" id="campoNome" placeholder="Ex: DEYE - SUN-8K-G">
                </div>
                <div class="config-group">
                    <div class="form-group">
                        <label for="campoPotencia">Potência (kW)</label>
                        <input type="number" id="campoPotencia" step="0.01" min="0" placeholder="Ex: 8">
                    </div>
                    <div class="form-group">
                        <label for="campoCorrente">Corrente Máxima de Saída (A)</label>
                        <input type="number" id="campoCorrente" step="0.01" min="0" placeholder="Ex: 40.2">
                    </div>
                </div>
                <div class="config-group">
                    <div class="form-group">
                        <label for="campoClasse">Classe</label>
                        <select id="campoClasse">
                            <option value="MONOFÁSICO">Monofásico</option>
                            <option value="TRIFÁSICO">Trifásico</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="campoCategoria">Categoria</label>
                        <select id="campoCategoria">
                            <option value="TRADICIONAL">Inversor Tradicional</option>
                            <option value="MICRO">Microinversor</option>
                        </select>
                    </div>
                </div>
                <button id="btnSalvar">Salvar inversor</button>

                <hr>

                <div class="lista-header">
                    <h3>Inversores cadastrados (<span id="totalInversores">0</span>)</h3>
                </div>
                <input type="text" id="buscaLista" class="busca-lista" placeholder="🔎 Filtrar lista...">
                <table>
                    <thead>
                        <tr><th>Inversor</th><th>Potência</th><th>Corrente</th><th>Classe</th><th>Categoria</th><th></th></tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import {
            getFirestore, collection, getDocs, setDoc, deleteDoc, doc
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const telaLogin = document.getElementById('telaLogin');
        const telaCadastro = document.getElementById('telaCadastro');
        const msgGlobal = document.getElementById('msgGlobal');
        let todosInversores = [];

        function mostrarMsg(texto, tipo) {
            msgGlobal.textContent = texto;
            msgGlobal.className = `msg ${tipo}`;
            msgGlobal.style.display = 'block';
            setTimeout(() => { msgGlobal.style.display = 'none'; }, 5000);
        }

        // Gera um ID estável a partir do nome (evita duplicar o mesmo inversor
        // e permite "editar" um inversor existente salvando de novo com o mesmo nome).
        function gerarSlug(nome) {
            return nome
                .normalize('NFD')
                .replace(new RegExp('[\\u0300-\\u036f]', 'g'), '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
        }

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;
            if (!email || !senha) {
                mostrarMsg('Informe e-mail e senha.', 'erro');
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (erro) {
                mostrarMsg('Login inválido: ' + erro.message, 'erro');
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (usuario) => {
            if (usuario) {
                telaLogin.style.display = 'none';
                telaCadastro.style.display = 'block';
                document.getElementById('usuarioLogado').textContent = `Conectado como ${usuario.email}`;
                carregarLista();
            } else {
                telaLogin.style.display = 'block';
                telaCadastro.style.display = 'none';
            }
        });

        document.getElementById('btnSalvar').addEventListener('click', async () => {
            const nome = document.getElementById('campoNome').value.trim();
            const potencia = parseFloat(document.getElementById('campoPotencia').value);
            const corrente = parseFloat(document.getElementById('campoCorrente').value);
            const classe = document.getElementById('campoClasse').value;
            const categoria = document.getElementById('campoCategoria').value;

            if (!nome || isNaN(potencia) || isNaN(corrente)) {
                mostrarMsg('Preencha nome, potência e corrente corretamente.', 'erro');
                return;
            }

            const slug = gerarSlug(nome);
            try {
                await setDoc(doc(db, 'inversores', slug), { inversor: nome, potencia, corrente, classe, categoria });
                mostrarMsg(`Inversor "${nome}" salvo com sucesso.`, 'sucesso');
                document.getElementById('campoNome').value = '';
                document.getElementById('campoPotencia').value = '';
                document.getElementById('campoCorrente').value = '';
                carregarLista();
            } catch (erro) {
                mostrarMsg('Erro ao salvar: ' + erro.message, 'erro');
            }
        });

        async function carregarLista() {
            const snapshot = await getDocs(collection(db, 'inversores'));
            todosInversores = snapshot.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => a.inversor.localeCompare(b.inversor));
            renderLista(todosInversores);
        }

        function renderLista(lista) {
            document.getElementById('totalInversores').textContent = lista.length;
            const corpo = document.getElementById('corpoTabela');
            corpo.innerHTML = '';
            lista.forEach(inv => {
                const tr = document.createElement('tr');
                const categoria = inv.categoria || 'TRADICIONAL';
                tr.innerHTML = `
                    <td>${inv.inversor}</td>
                    <td>${inv.potencia}kW</td>
                    <td>${inv.corrente}A</td>
                    <td>${inv.classe}</td>
                    <td>${categoria === 'MICRO' ? '⚡ Micro' : 'Tradicional'}</td>
                    <td><button class="remover" data-id="${inv.id}">Remover</button></td>
                `;
                corpo.appendChild(tr);
            });
            corpo.querySelectorAll('button.remover').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Remover este inversor?')) return;
                    await deleteDoc(doc(db, 'inversores', btn.dataset.id));
                    carregarLista();
                });
            });
        }

        document.getElementById('buscaLista').addEventListener('input', function() {
            const termo = this.value.toLowerCase().trim();
            renderLista(todosInversores.filter(inv => inv.inversor.toLowerCase().includes(termo)));
        });
    </script>
</body>
</html>
