<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Inversores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.6em; }
        .header a { color: white; text-decoration: none; font-size: 0.9em; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #2c3e50; }
        select, input, button {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        button:hover { background: #2980b9; }
        button.secundario { background: #7f8c8d; margin-top: 8px; }
        button.secundario:hover { background: #636e72; }
        button.remover { background: #e74c3c; width: auto; padding: 6px 12px; font-size: 0.85em; }
        button.remover:hover { background: #c0392b; }
        .config-group { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .msg { padding: 12px 15px; border-radius: 8px; margin-bottom: 18px; font-weight: 600; display: none; }
        .msg.erro { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .msg.sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e9ecef; font-size: 0.9em; }
        th { color: #495057; }
        #telaLogin { max-width: 380px; margin: 40px auto; }
        #telaCadastro { display: none; }
        hr { margin: 30px 0; border: none; border-top: 1px solid #e9ecef; }
        .lista-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .busca-lista { max-width: 260px; margin-bottom: 10px; }
        .box-ia { background: #f4f8fc; border: 2px dashed #3498db; border-radius: 12px; padding: 18px; margin-bottom: 25px; }
        .box-ia h3 { margin-bottom: 12px; }
        .linha-api { display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; margin-bottom: 12px; align-items: end; }
        .linha-api button { width: auto; }
        .status-ia { margin-top: 10px; font-size: 0.9em; color: #495057; white-space: pre-wrap; }
        #tabelaRevisao input[type=text], #tabelaRevisao input[type=number], #tabelaRevisao select { padding: 6px 8px; font-size: 0.9em; border-width: 1px; }
        #tabelaRevisao input[type=checkbox] { width: auto; }
        #tabelaRevisao td { padding: 6px 4px; }
        #tabelaRevisao tr.existente td:first-child::after { content: ''; }
        .aviso-existe { color: #d35400; font-size: 0.75em; display: block; }
        #areaRevisao { display: none; margin-top: 15px; overflow-x: auto; }
        .acoes-revisao { display: flex; gap: 10px; margin-top: 12px; }
        .acoes-revisao button { margin-top: 0 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Cadastro de Inversores</h1>
            <a href="index.html">&larr; Voltar ao dimensionamento</a>
        </div>
        <div class="content">
            <div id="msgGlobal" class="msg"></div>

            <div id="telaLogin">
                <h3 style="margin-bottom:15px;">Login</h3>
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="loginSenha">Senha</label>
                    <input type="password" id="loginSenha" placeholder="••••••••">
                </div>
                <button id="btnLogin">Entrar</button>
            </div>

            <div id="telaCadastro">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <span id="usuarioLogado" style="color:#495057;font-size:0.9em;"></span>
                    <button id="btnLogout" class="secundario" style="width:auto;padding:8px 14px;">Sair</button>
                </div>

                <div class="box-ia">
                    <h3>📄 Importar do datasheet (IA)</h3>
                    <div class="linha-api">
                        <div>
                            <label for="apiKey">Chave da API OpenAI</label>
                            <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
                        </div>
                        <div>
                            <label for="modeloIA">Modelo</label>
                            <select id="modeloIA">
                                <option value="gpt-4o">gpt-4o</option>
                                <option value="gpt-4o-mini">gpt-4o-mini</option>
                                <option value="gpt-4.1">gpt-4.1</option>
                            </select>
                        </div>
                        <button id="btnSalvarChave" class="secundario" style="margin-top:0;">Salvar chave</button>
                    </div>
                    <div class="form-group">
                        <label for="arquivoDatasheet">Datasheet (PDF ou imagem)</label>
                        <input type="file" id="arquivoDatasheet" accept=".pdf,image/*">
                    </div>
                    <button id="btnExtrair">Extrair inversores do datasheet</button>
                    <div id="statusIA" class="status-ia"></div>

                    <div id="areaRevisao">
                        <strong>Revise os dados antes de cadastrar:</strong>
                        <table id="tabelaRevisao">
                            <thead>
                                <tr><th></th><th>Marca - Modelo</th><th>Potência (kW)</th><th>Corrente (A)</th><th>Classe</th><th>Categoria</th><th></th></tr>
                            </thead>
                            <tbody id="corpoRevisao"></tbody>
                        </table>
                        <div class="acoes-revisao">
                            <button id="btnCadastrarRevisao">Cadastrar selecionados</button>
                            <button id="btnDescartarRevisao" class="secundario">Descartar</button>
                        </div>
                    </div>
                </div>

                <h3 style="margin-bottom:15px;">Novo inversor (manual)</h3>
                <div class="form-group">
                    <label for="campoNome">Marca - Modelo</label>
                    <input type="text" id="campoNome" placeholder="Ex: DEYE - SUN-8K-G">
                </div>
                <div class="config-group">
                    <div class="form-group">
                        <label for="campoPotencia">Potência (kW)</label>
                        <input type="number" id="campoPotencia" step="0.01" min="0" placeholder="Ex: 8">
                    </div>
                    <div class="form-group">
                        <label for="campoCorrente">Corrente Máxima de Saída (A)</label>
                        <input type="number" id="campoCorrente" step="0.01" min="0" placeholder="Ex: 40.2">
                    </div>
                </div>
                <div class="config-group">
                    <div class="form-group">
                        <label for="campoClasse">Classe</label>
                        <select id="campoClasse">
                            <option value="MONOFÁSICO">Monofásico</option>
                            <option value="TRIFÁSICO">Trifásico</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="campoCategoria">Categoria</label>
                        <select id="campoCategoria">
                            <option value="TRADICIONAL">Inversor Tradicional</option>
                            <option value="MICRO">Microinversor</option>
                        </select>
                    </div>
                </div>
                <button id="btnSalvar">Salvar inversor</button>

                <hr>

                <div class="lista-header">
                    <h3>Inversores cadastrados (<span id="totalInversores">0</span>)</h3>
                </div>
                <input type="text" id="buscaLista" class="busca-lista" placeholder="🔎 Filtrar lista...">
                <table>
                    <thead>
                        <tr><th>Inversor</th><th>Potência</th><th>Corrente</th><th>Classe</th><th>Categoria</th><th></th></tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import {
            getFirestore, collection, getDocs, setDoc, deleteDoc, doc
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const telaLogin = document.getElementById('telaLogin');
        const telaCadastro = document.getElementById('telaCadastro');
        const msgGlobal = document.getElementById('msgGlobal');
        let todosInversores = [];

        function mostrarMsg(texto, tipo) {
            msgGlobal.textContent = texto;
            msgGlobal.className = `msg ${tipo}`;
            msgGlobal.style.display = 'block';
            setTimeout(() => { msgGlobal.style.display = 'none'; }, 5000);
        }

        // Gera um ID estável a partir do nome (evita duplicar o mesmo inversor
        // e permite "editar" um inversor existente salvando de novo com o mesmo nome).
        function gerarSlug(nome) {
            return nome
                .normalize('NFD')
                .replace(new RegExp('[\\u0300-\\u036f]', 'g'), '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
        }

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;
            if (!email || !senha) {
                mostrarMsg('Informe e-mail e senha.', 'erro');
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (erro) {
                mostrarMsg('Login inválido: ' + erro.message, 'erro');
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (usuario) => {
            if (usuario) {
                telaLogin.style.display = 'none';
                telaCadastro.style.display = 'block';
                document.getElementById('usuarioLogado').textContent = `Conectado como ${usuario.email}`;
                carregarLista();
            } else {
                telaLogin.style.display = 'block';
                telaCadastro.style.display = 'none';
            }
        });

        document.getElementById('btnSalvar').addEventListener('click', async () => {
            const nome = document.getElementById('campoNome').value.trim();
            const potencia = parseFloat(document.getElementById('campoPotencia').value);
            const corrente = parseFloat(document.getElementById('campoCorrente').value);
            const classe = document.getElementById('campoClasse').value;
            const categoria = document.getElementById('campoCategoria').value;

            if (!nome || isNaN(potencia) || isNaN(corrente)) {
                mostrarMsg('Preencha nome, potência e corrente corretamente.', 'erro');
                return;
            }

            const slug = gerarSlug(nome);
            try {
                await setDoc(doc(db, 'inversores', slug), { inversor: nome, potencia, corrente, classe, categoria });
                mostrarMsg(`Inversor "${nome}" salvo com sucesso.`, 'sucesso');
                document.getElementById('campoNome').value = '';
                document.getElementById('campoPotencia').value = '';
                document.getElementById('campoCorrente').value = '';
                carregarLista();
            } catch (erro) {
                mostrarMsg('Erro ao salvar: ' + erro.message, 'erro');
            }
        });

        async function carregarLista() {
            const snapshot = await getDocs(collection(db, 'inversores'));
            todosInversores = snapshot.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => a.inversor.localeCompare(b.inversor));
            renderLista(todosInversores);
        }

        function renderLista(lista) {
            document.getElementById('totalInversores').textContent = lista.length;
            const corpo = document.getElementById('corpoTabela');
            corpo.innerHTML = '';
            lista.forEach(inv => {
                const tr = document.createElement('tr');
                const categoria = inv.categoria || 'TRADICIONAL';
                tr.innerHTML = `
                    <td>${inv.inversor}</td>
                    <td>${inv.potencia}kW</td>
                    <td>${inv.corrente}A</td>
                    <td>${inv.classe}</td>
                    <td>${categoria === 'MICRO' ? '⚡ Micro' : 'Tradicional'}</td>
                    <td><button class="remover" data-id="${inv.id}">Remover</button></td>
                `;
                corpo.appendChild(tr);
            });
            corpo.querySelectorAll('button.remover').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Remover este inversor?')) return;
                    await deleteDoc(doc(db, 'inversores', btn.dataset.id));
                    carregarLista();
                });
            });
        }

        // ================= Extração via IA =================
        const PDFJS_VERSION = '4.4.168';
        const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/`;
        const elChave = document.getElementById('apiKey');
        const elModelo = document.getElementById('modeloIA');
        const elStatus = document.getElementById('statusIA');
        let pdfjsLib = null;

        try {
            elChave.value = localStorage.getItem('openai_api_key') || '';
            elModelo.value = localStorage.getItem('openai_modelo') || 'gpt-4o';
        } catch (e) {}

        document.getElementById('btnSalvarChave').addEventListener('click', () => {
            try {
                localStorage.setItem('openai_api_key', elChave.value.trim());
                localStorage.setItem('openai_modelo', elModelo.value);
                mostrarMsg('Chave salva neste navegador.', 'sucesso');
            } catch (e) {
                mostrarMsg('Não foi possível salvar no navegador.', 'erro');
            }
        });
        elModelo.addEventListener('change', () => {
            try { localStorage.setItem('openai_modelo', elModelo.value); } catch (e) {}
        });

        async function carregarPdfJs() {
            if (pdfjsLib) return pdfjsLib;
            pdfjsLib = await import(PDFJS_BASE + 'pdf.min.mjs');
            // Worker cross-origin precisa ser carregado via blob
            const codigo = await (await fetch(PDFJS_BASE + 'pdf.worker.min.mjs')).text();
            pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([codigo], { type: 'text/javascript' }));
            return pdfjsLib;
        }

        function lerComoDataURL(arquivo) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(r.result);
                r.onerror = rej;
                r.readAsDataURL(arquivo);
            });
        }

        // Retorna { texto, imagens } — usa texto do PDF; se for escaneado, renderiza páginas como imagem.
        async function prepararConteudo(arquivo) {
            if (arquivo.type.startsWith('image/')) {
                return { texto: '', imagens: [await lerComoDataURL(arquivo)] };
            }
            const lib = await carregarPdfJs();
            const pdf = await lib.getDocument({ data: await arquivo.arrayBuffer() }).promise;
            let texto = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const pagina = await pdf.getPage(i);
                const c = await pagina.getTextContent();
                // Reconstrói linhas pela posição Y para preservar tabelas
                const linhas = [];
                let ultimoY = null, atual = '';
                c.items.forEach(it => {
                    const y = Math.round(it.transform[5]);
                    if (ultimoY !== null && Math.abs(y - ultimoY) > 3) { linhas.push(atual); atual = ''; }
                    atual += it.str + (it.hasEOL ? '' : ' | ');
                    ultimoY = y;
                });
                if (atual) linhas.push(atual);
                texto += `\n--- Página ${i} ---\n` + linhas.join('\n');
            }
            if (texto.replace(/[\s|\-]|Página \d+/g, '').length > 300) {
                return { texto, imagens: [] };
            }
            // PDF escaneado: renderiza até 6 páginas como imagem
            const imagens = [];
            for (let i = 1; i <= Math.min(pdf.numPages, 6); i++) {
                const pagina = await pdf.getPage(i);
                const vp = pagina.getViewport({ scale: 1.8 });
                const canvas = document.createElement('canvas');
                canvas.width = vp.width; canvas.height = vp.height;
                await pagina.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                imagens.push(canvas.toDataURL('image/jpeg', 0.85));
            }
            return { texto: '', imagens };
        }

        const PROMPT_SISTEMA = `Você extrai dados de datasheets de inversores solares fotovoltaicos.
Um datasheet pode conter VÁRIOS modelos (colunas de uma tabela). Liste TODOS os modelos de inversor do documento, um item por modelo.
Para cada modelo retorne:
- "inversor": string "MARCA - MODELO" em MAIÚSCULAS para a marca (ex: "DEYE - SUN-8K-SG05LP1"). Use o código exato do modelo como no datasheet.
- "potencia": número em kW da potência nominal de saída CA (AC). Converta W para kW (ex: 8000 W -> 8). Não use potência de entrada CC/FV.
- "corrente": número em A da corrente MÁXIMA de saída CA (max. AC output current / corrente de saída máxima). Se só existir a corrente nominal, use-a. Se for micro com várias entradas, use a corrente de saída CA total.
- "classe": "MONOFÁSICO" ou "TRIFÁSICO" (pela saída CA: 1 fase/monofásico/single phase = MONOFÁSICO; 3 fases/three phase = TRIFÁSICO).
- "categoria": "MICRO" se for microinversor (ex: vários MPPT/entradas individuais por módulo, famílias como Hoymiles HMS/HMT, APsystems, Deye SUN-M, Enphase), senão "TRADICIONAL".
Use null para o que não encontrar (não invente). Se houver mais de uma corrente por tensão, prefira a de 220 V/230 V em monofásicos e a de 380 V/400 V em trifásicos.
Responda SOMENTE com JSON no formato: {"inversores":[{"inversor":"","potencia":0,"corrente":0,"classe":"","categoria":""}]}`;

        async function chamarOpenAI(chave, modelo, conteudo) {
            const partes = [];
            if (conteudo.texto) {
                partes.push({ type: 'text', text: 'Texto extraído do datasheet:\n' + conteudo.texto.slice(0, 120000) });
            } else {
                partes.push({ type: 'text', text: 'Páginas do datasheet (imagens):' });
                conteudo.imagens.forEach(url => partes.push({ type: 'image_url', image_url: { url } }));
            }
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + chave },
                body: JSON.stringify({
                    model: modelo,
                    temperature: 0,
                    response_format: { type: 'json_object' },
                    messages: [
                        { role: 'system', content: PROMPT_SISTEMA },
                        { role: 'user', content: partes }
                    ]
                })
            });
            const dados = await resp.json();
            if (!resp.ok) throw new Error(dados.error?.message || ('HTTP ' + resp.status));
            const json = JSON.parse(dados.choices[0].message.content);
            return Array.isArray(json.inversores) ? json.inversores : [];
        }

        document.getElementById('btnExtrair').addEventListener('click', async () => {
            const chave = elChave.value.trim();
            const arquivo = document.getElementById('arquivoDatasheet').files[0];
            if (!chave) { mostrarMsg('Informe a chave da API da OpenAI.', 'erro'); return; }
            if (!arquivo) { mostrarMsg('Selecione o datasheet.', 'erro'); return; }
            const btn = document.getElementById('btnExtrair');
            btn.disabled = true;
            try {
                elStatus.textContent = 'Lendo o arquivo...';
                const conteudo = await prepararConteudo(arquivo);
                elStatus.textContent = conteudo.texto
                    ? 'Enviando texto do datasheet para a IA...'
                    : 'Datasheet sem texto (escaneado) — enviando imagens para a IA...';
                const lista = await chamarOpenAI(chave, elModelo.value, conteudo);
                if (!lista.length) {
                    elStatus.textContent = 'A IA não encontrou inversores nesse arquivo.';
                    return;
                }
                montarRevisao(lista);
                elStatus.textContent = `${lista.length} inversor(es) encontrado(s). Confira os campos e cadastre.`;
            } catch (erro) {
                elStatus.textContent = 'Erro: ' + erro.message;
            } finally {
                btn.disabled = false;
            }
        });

        function montarRevisao(lista) {
            const corpo = document.getElementById('corpoRevisao');
            corpo.innerHTML = '';
            const existentes = new Set(todosInversores.map(i => i.id));
            lista.forEach(inv => {
                const nome = String(inv.inversor || '').trim();
                const classe = String(inv.classe || '').toUpperCase().startsWith('TRI') ? 'TRIFÁSICO' : 'MONOFÁSICO';
                const categoria = String(inv.categoria || '').toUpperCase() === 'MICRO' ? 'MICRO' : 'TRADICIONAL';
                const tr = document.createElement('tr');
                const jaExiste = nome && existentes.has(gerarSlug(nome));
                tr.innerHTML = `
                    <td><input type="checkbox" class="r-sel" checked></td>
                    <td><input type="text" class="r-nome"></td>
                    <td><input type="number" class="r-pot" step="0.01" min="0"></td>
                    <td><input type="number" class="r-cor" step="0.01" min="0"></td>
                    <td><select class="r-classe"><option value="MONOFÁSICO">Monofásico</option><option value="TRIFÁSICO">Trifásico</option></select></td>
                    <td><select class="r-cat"><option value="TRADICIONAL">Tradicional</option><option value="MICRO">Micro</option></select></td>
                    <td><button class="remover r-del" title="Remover linha">✕</button></td>`;
                tr.querySelector('.r-nome').value = nome;
                tr.querySelector('.r-pot').value = inv.potencia ?? '';
                tr.querySelector('.r-cor').value = inv.corrente ?? '';
                tr.querySelector('.r-classe').value = classe;
                tr.querySelector('.r-cat').value = categoria;
                if (jaExiste) {
                    const aviso = document.createElement('span');
                    aviso.className = 'aviso-existe';
                    aviso.textContent = 'já cadastrado — será sobrescrito';
                    tr.querySelector('td:nth-child(2)').appendChild(aviso);
                }
                tr.querySelector('.r-del').addEventListener('click', () => tr.remove());
                corpo.appendChild(tr);
            });
            document.getElementById('areaRevisao').style.display = 'block';
        }

        document.getElementById('btnDescartarRevisao').addEventListener('click', () => {
            document.getElementById('corpoRevisao').innerHTML = '';
            document.getElementById('areaRevisao').style.display = 'none';
        });

        document.getElementById('btnCadastrarRevisao').addEventListener('click', async () => {
            const linhas = [...document.querySelectorAll('#corpoRevisao tr')].filter(tr => tr.querySelector('.r-sel').checked);
            if (!linhas.length) { mostrarMsg('Nenhum inversor selecionado.', 'erro'); return; }
            const itens = [];
            for (const tr of linhas) {
                const nome = tr.querySelector('.r-nome').value.trim();
                const potencia = parseFloat(tr.querySelector('.r-pot').value);
                const corrente = parseFloat(tr.querySelector('.r-cor').value);
                if (!nome || isNaN(potencia) || isNaN(corrente)) {
                    tr.style.background = '#fdecea';
                    mostrarMsg('Preencha nome, potência e corrente nas linhas marcadas em vermelho.', 'erro');
                    return;
                }
                tr.style.background = '';
                itens.push({
                    inversor: nome, potencia, corrente,
                    classe: tr.querySelector('.r-classe').value,
                    categoria: tr.querySelector('.r-cat').value
                });
            }
            try {
                for (const it of itens) await setDoc(doc(db, 'inversores', gerarSlug(it.inversor)), it);
                mostrarMsg(`${itens.length} inversor(es) cadastrado(s) com sucesso.`, 'sucesso');
                document.getElementById('corpoRevisao').innerHTML = '';
                document.getElementById('areaRevisao').style.display = 'none';
                elStatus.textContent = '';
                carregarLista();
            } catch (erro) {
                mostrarMsg('Erro ao cadastrar: ' + erro.message, 'erro');
            }
        });

        document.getElementById('buscaLista').addEventListener('input', function() {
            const termo = this.value.toLowerCase().trim();
            renderLista(todosInversores.filter(inv => inv.inversor.toLowerCase().includes(termo)));
        });
    </script>
</body>
</html>
